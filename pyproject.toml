# pyproject.toml
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-federated-causal-discovery"
version = "0.1.0"
description = "Federated causal discovery with differential privacy on MLX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quan Pin", email = "quanpin0114@gmail.com" },
]
dependencies = [
    "mlx>=0.18",
    "flwr>=1.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools]
packages = ["data", "experiments"]
py-modules = [
    "cumulant",
    "dp",
    "hc_lingam",
    "evaluation",
    "client",
    "server",
    "federated",
    "visualize",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"